<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Rectangle 9 by 12 with diagonal</title>
  <desc id="desc">A rectangle measuring 9 by 12, with its diagonal drawn. The diagonal is unknown, marked x, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <polygon points="60,220 260,220 260,90 60,90" fill="none" stroke="#2a5db0" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="60" y1="220" x2="260" y2="90" stroke="#d9480f" stroke-width="2.2"/>
  <path d="M238 220 L238 198 L260 198" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <g fill="#3a2f22">
    <circle cx="60" cy="220" r="3.5"/>
    <circle cx="260" cy="220" r="3.5"/>
    <circle cx="260" cy="90" r="3.5"/>
    <circle cx="60" cy="90" r="3.5"/>
  </g>

  <text x="270" y="158" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">9</text>
  <text x="150" y="240" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">12</text>
  <text x="130" y="145" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">x</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
