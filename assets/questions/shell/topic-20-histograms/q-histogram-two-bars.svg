<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Histogram comparing two classes of different widths</title>
  <desc id="desc">A histogram with two bars. Class A has width 5 and frequency 20, giving frequency density 4. Class B has width 8 and frequency 24, giving frequency density 3. Class A's bar is taller even though its frequency is lower, because it is narrower.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="50" y1="230" x2="300" y2="230" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="50" y1="230" x2="50" y2="30" stroke="#3a2f22" stroke-width="1.5"/>
  <text x="255" y="248" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">Value</text>
  <text x="8" y="26" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">Frequency</text>
  <text x="8" y="40" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">density</text>

  <rect x="50" y="150" width="60" height="80" fill="#2a5db0" fill-opacity="0.18" stroke="#2a5db0" stroke-width="2.2"/>
  <rect x="110" y="170" width="96" height="60" fill="#d9480f" fill-opacity="0.14" stroke="#d9480f" stroke-width="2.2"/>

  <text x="80" y="145" text-anchor="middle" fill="#2a5db0" font-family="Arial, sans-serif" font-size="13" font-weight="700">Class A</text>
  <text x="158" y="165" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="13" font-weight="700">Class B</text>

  <text x="80" y="244" text-anchor="middle" fill="#2a5db0" font-family="Arial, sans-serif" font-size="11">width 5, freq 20</text>
  <text x="158" y="258" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="11">width 8, freq 24</text>

  <text x="170" y="272" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Which bar is taller?</text>
</svg>
