<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
  <title id="title">Coordinate midpoint diagram</title>
  <desc id="desc">A coordinate grid with point A at one two and point B at seven four.</desc>
  <rect width="420" height="300" fill="#fffdf8"/>
  <g stroke="#e8dccb" stroke-width="1">
    <line x1="60" y1="30" x2="60" y2="260"/><line x1="100" y1="30" x2="100" y2="260"/><line x1="140" y1="30" x2="140" y2="260"/><line x1="180" y1="30" x2="180" y2="260"/><line x1="220" y1="30" x2="220" y2="260"/><line x1="260" y1="30" x2="260" y2="260"/><line x1="300" y1="30" x2="300" y2="260"/><line x1="340" y1="30" x2="340" y2="260"/>
    <line x1="40" y1="220" x2="380" y2="220"/><line x1="40" y1="180" x2="380" y2="180"/><line x1="40" y1="140" x2="380" y2="140"/><line x1="40" y1="100" x2="380" y2="100"/><line x1="40" y1="60" x2="380" y2="60"/>
  </g>
  <g stroke="#8f6a45" stroke-width="2">
    <line x1="40" y1="260" x2="390" y2="260"/>
    <line x1="40" y1="260" x2="40" y2="20"/>
  </g>
  <g fill="#5f4a32" font-size="12" font-family="Georgia, serif">
    <text x="387" y="278">x</text>
    <text x="28" y="24">y</text>
    <text x="95" y="278">1</text><text x="135" y="278">2</text><text x="175" y="278">3</text><text x="215" y="278">4</text><text x="255" y="278">5</text><text x="295" y="278">6</text><text x="335" y="278">7</text>
    <text x="22" y="225">1</text><text x="22" y="185">2</text><text x="22" y="145">3</text><text x="22" y="105">4</text><text x="22" y="65">5</text>
  </g>
  <g fill="#b98244" stroke="#8f6a45" stroke-width="2">
    <circle cx="80" cy="180" r="5"/>
    <circle cx="320" cy="100" r="5"/>
  </g>
  <g fill="#5f4a32" font-size="14" font-weight="700" font-family="Georgia, serif">
    <text x="68" y="172">A</text>
    <text x="328" y="92">B</text>
  </g>
</svg>
