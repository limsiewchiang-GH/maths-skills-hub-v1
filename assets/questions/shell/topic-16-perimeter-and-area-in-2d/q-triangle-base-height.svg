<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Triangle with base 14 and height 9</title>
  <desc id="desc">A triangle with base 14 and a dashed perpendicular height of 9 drawn from the apex to the base. The area is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <polygon points="60,200 280,200 190,80" fill="#d9480f" fill-opacity="0.06" stroke="#2a5db0" stroke-width="2.5" stroke-linejoin="round"/>

  <line x1="190" y1="80" x2="190" y2="200" stroke="#3a2f22" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M182 200 L182 192 L190 192" fill="none" stroke="#3a2f22" stroke-width="1.6"/>

  <text x="170" y="220" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">14</text>
  <text x="200" y="145" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">9</text>

  <text x="120" y="165" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">Area = ?</text>

  <text x="170" y="240" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
