<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Semicircle of radius 6</title>
  <desc id="desc">A semicircle with radius 6. Its area is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <path d="M85,155 A85 85 0 0 1 255,155 Z" fill="#d9480f" fill-opacity="0.08" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="85" y1="155" x2="255" y2="155" stroke="#2a5db0" stroke-width="2.5"/>

  <line x1="170" y1="155" x2="170" y2="70" stroke="#3a2f22" stroke-width="2"/>
  <circle cx="170" cy="155" r="3.5" fill="#3a2f22"/>

  <text x="180" y="115" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">6</text>

  <text x="170" y="185" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">Area = ?</text>

  <text x="170" y="250" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
