<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">L-shape made from two rectangles</title>
  <desc id="desc">An L-shaped compound figure made from a rectangle 8 by 3 and a rectangle 5 by 2. The total area is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <polygon points="80,220 240,220 240,160 160,160 160,100 80,100" fill="#d9480f" fill-opacity="0.08" stroke="#2a5db0" stroke-width="2.5" stroke-linejoin="round"/>

  <line x1="160" y1="100" x2="160" y2="220" stroke="#6b6157" stroke-width="1.4" stroke-dasharray="4 3"/>

  <text x="118" y="240" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="14" font-weight="700">8</text>
  <text x="66" y="164" fill="#3a2f22" font-family="Arial, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="200" y="240" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="14" font-weight="700">5</text>
  <text x="246" y="194" fill="#3a2f22" font-family="Arial, sans-serif" font-size="14" font-weight="700">2</text>

  <text x="200" y="140" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">Area = ?</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
