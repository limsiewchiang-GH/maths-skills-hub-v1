  <text x="313" y="134" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">x</text>
  <text x="44" y="23" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">y</text>

  <path d="M40.0,267.5 L46.5,247.6 L53.0,228.7 L59.5,210.8 L66.0,194.0 L72.5,178.2 L79.0,163.4 L85.5,149.6 L92.0,136.8 L98.5,125.1 L105.0,114.4 L111.5,104.7 L118.0,96.0 L124.5,88.3 L131.0,81.7 L137.5,76.1 L144.0,71.5 L150.5,67.9 L157.0,65.4 L163.5,63.8 L170.0,63.3 L176.5,63.8 L183.0,65.4 L189.5,67.9 L196.0,71.5 L202.5,76.1 L209.0,81.7 L215.5,88.3 L222.0,96.0 L228.5,104.7 L235.0,114.4 L241.5,125.1 L248.0,136.8 L254.5,149.6 L261.0,163.4 L267.5,178.2 L274.0,194.0 L280.5,210.8 L287.0,228.7 L293.5,247.6 L300.0,267.5" fill="none" stroke="#d9480f" stroke-width="2.5"/>

  <circle cx="170" cy="63.3" r="3.5" fill="#3a2f22"/>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">y = −x² + 6x − 5</text>
</svg>
