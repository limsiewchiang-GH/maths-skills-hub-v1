<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Graph of y = negative x squared plus 6x minus 5</title>
  <desc id="desc">The graph of y = -x^2 + 6x - 5, a parabola whose direction of opening (up or down) is to be determined.</desc>
