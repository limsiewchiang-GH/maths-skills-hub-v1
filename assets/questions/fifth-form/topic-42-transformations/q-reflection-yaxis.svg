<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Reflect the point (5,2) in the y-axis</title>
  <desc id="desc">A coordinate grid showing the point (5,2) and the y-axis as the mirror line. The reflected point on the other side of the y-axis is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="40" y1="150" x2="310" y2="150" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="170" y1="240" x2="170" y2="30" stroke="#2a5db0" stroke-width="2.2"/>
  <text x="313" y="154" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">x</text>
  <text x="176" y="38" fill="#2a5db0" font-family="Arial, sans-serif" font-size="13" font-weight="700">mirror line</text>

  <circle cx="280" cy="106" r="4.5" fill="#3a2f22"/>
  <text x="288" y="102" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">(5,2)</text>

  <line x1="280" y1="106" x2="60" y2="106" stroke="#6b6157" stroke-width="1.4" stroke-dasharray="4 3"/>

  <circle cx="60" cy="106" r="4.5" fill="#d9480f"/>
  <text x="35" y="102" text-anchor="end" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">?</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Reflect in the y-axis.</text>
</svg>
