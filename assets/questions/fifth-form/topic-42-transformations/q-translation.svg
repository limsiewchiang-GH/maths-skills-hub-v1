<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Translate the point (2,-1) by the vector (3,4)</title>
  <desc id="desc">A coordinate grid showing the point (2,-1) and the translation vector (3,4) drawn as an arrow. The translated point is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="40" y1="150" x2="310" y2="150" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="170" y1="240" x2="170" y2="30" stroke="#3a2f22" stroke-width="1.5"/>
  <text x="313" y="154" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">x</text>
  <text x="174" y="38" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">y</text>

  <circle cx="214" cy="172" r="4.5" fill="#3a2f22"/>
  <text x="222" y="188" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">(2,−1)</text>

  <line x1="214" y1="172" x2="280" y2="84" stroke="#2a5db0" stroke-width="2.5" stroke-dasharray="7 4"/>
  <polygon points="280,84 278.2,93.9 271.0,88.5" fill="#2a5db0"/>

  <circle cx="280" cy="84" r="4.5" fill="#d9480f"/>
  <text x="256" y="70" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">?</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Translate by the vector (3, 4).</text>
</svg>
