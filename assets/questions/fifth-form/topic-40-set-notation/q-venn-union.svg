<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Venn diagram: union of A and B</title>
  <desc id="desc">Two overlapping circles, A containing 1 and 2, and B containing 4 and 5, with 3 in the overlap. Both circles entirely, shaded, represent the union of A and B, which is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <rect x="50" y="60" width="240" height="180" fill="none" stroke="#3a2f22" stroke-width="2"/>
  <text x="58" y="52" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">U</text>

  <circle cx="135" cy="150" r="65" fill="#d9480f" fill-opacity="0.16" stroke="#2a5db0" stroke-width="2.5"/>
  <circle cx="205" cy="150" r="65" fill="#d9480f" fill-opacity="0.16" stroke="#2a5db0" stroke-width="2.5"/>

  <text x="115" y="90" text-anchor="middle" fill="#2a5db0" font-family="Arial, sans-serif" font-size="15" font-weight="700">A</text>
  <text x="225" y="90" text-anchor="middle" fill="#2a5db0" font-family="Arial, sans-serif" font-size="15" font-weight="700">B</text>

  <text x="100" y="155" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">1</text>
  <text x="100" y="180" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">2</text>
  <text x="170" y="167" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">3</text>
  <text x="240" y="155" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
  <text x="240" y="180" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">5</text>

  <text x="170" y="256" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="13" font-style="italic" font-weight="700">Shaded: A ∪ B = ?</text>
</svg>
