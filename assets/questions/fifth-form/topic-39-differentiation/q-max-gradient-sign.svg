  <circle cx="170" cy="84.3" r="4.5" fill="#d9480f"/>

  <text x="170" y="264" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">Type of stationary point = ?</text>
