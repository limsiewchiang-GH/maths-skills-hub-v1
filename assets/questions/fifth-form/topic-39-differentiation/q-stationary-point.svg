  <line x1="140" y1="203.6" x2="200" y2="203.6" stroke="#3a2f22" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="170" cy="203.6" r="4.5" fill="#d9480f"/>

  <text x="170" y="264" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">Stationary point = ?</text>
