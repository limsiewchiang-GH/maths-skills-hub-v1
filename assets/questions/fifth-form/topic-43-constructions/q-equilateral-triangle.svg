<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Constructing an equilateral triangle</title>
  <desc id="desc">A base segment AB. Two arcs, each with radius equal to AB, are swung from A and from B and cross at C. Triangle ABC, formed by joining A, B and C, is equilateral.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="80" cy="220" r="160" fill="none" stroke="#6b6157" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="240" cy="220" r="160" fill="none" stroke="#6b6157" stroke-width="1.3" stroke-dasharray="4 3"/>

  <polygon points="80,220 240,220 160,81.4" fill="#d9480f" fill-opacity="0.06" stroke="#2a5db0" stroke-width="2.5" stroke-linejoin="round"/>

  <g fill="#3a2f22">
    <circle cx="80" cy="220" r="4"/>
    <circle cx="240" cy="220" r="4"/>
    <circle cx="160" cy="81.4" r="4"/>
  </g>
  <text x="62" y="238" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">A</text>
  <text x="246" y="238" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">B</text>
  <text x="160" y="70" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">C</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Equal arcs of radius AB from A and B meet at C.</text>
</svg>
