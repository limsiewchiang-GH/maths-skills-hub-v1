<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Distance-time graph with several sections</title>
  <desc id="desc">A distance-time graph with four sections: a steep rising line, a flat horizontal section, a less steep rising line, and a line sloping back down towards the start.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="45" y1="220" x2="45" y2="30" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="45" y1="220" x2="310" y2="220" stroke="#3a2f22" stroke-width="1.5"/>
  <text x="10" y="35" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">Distance</text>
  <text x="270" y="238" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">Time</text>

  <polyline points="45,220 105,90 165,90 220,140 300,220" fill="none" stroke="#2a5db0" stroke-width="2.5"/>

  <text x="60" y="160" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">A</text>
  <text x="135" y="82" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">B</text>
  <text x="192" y="108" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">C</text>
  <text x="262" y="172" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">D</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">What does each section of the journey mean?</text>
</svg>
