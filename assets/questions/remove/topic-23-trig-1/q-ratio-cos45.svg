<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Right-angled triangle with a 45 degree angle</title>
  <desc id="desc">A right-angled triangle with the right angle at the bottom right. The angle at the bottom left is marked 45 degrees. The adjacent side (horizontal, along the bottom) is marked 1. The hypotenuse (the slanted side) is marked square root 2.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <polygon points="60,220 260,220 260,70" fill="none" stroke="#2a5db0" stroke-width="2.5" stroke-linejoin="round"/>

  <path d="M238 220 L238 198 L260 198" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <g fill="#3a2f22">
    <circle cx="60" cy="220" r="3.5"/>
    <circle cx="260" cy="220" r="3.5"/>
    <circle cx="260" cy="70" r="3.5"/>
  </g>

  <path d="M100 220 A40 40 0 0 0 91.55 197.9" fill="none" stroke="#d9480f" stroke-width="2.2"/>
  <text x="98" y="206" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">45°</text>

  <text x="150" y="238" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">1</text>
  <text x="140" y="127" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">√2</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
