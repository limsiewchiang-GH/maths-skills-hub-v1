<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Angle of elevation diagram: ladder against a wall</title>
  <desc id="desc">A vertical wall on the right, marked 5 m high, where a ladder reaches. The ladder's base is on the ground, 12 m from the wall. The angle of elevation, between the ground and the ladder, is marked x degrees, the unknown to find.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <polygon points="60,220 260,220 260,70" fill="none" stroke="#2a5db0" stroke-width="2.5" stroke-linejoin="round"/>

  <path d="M238 220 L238 198 L260 198" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <g fill="#3a2f22">
    <circle cx="60" cy="220" r="3.5"/>
    <circle cx="260" cy="220" r="3.5"/>
    <circle cx="260" cy="70" r="3.5"/>
  </g>

  <path d="M100 220 A40 40 0 0 0 91.55 197.9" fill="none" stroke="#d9480f" stroke-width="2.2"/>
  <text x="98" y="206" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">x°</text>

  <text x="270" y="148" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">5 m</text>
  <text x="128" y="127" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">ladder</text>
  <text x="145" y="238" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16" font-weight="700">12 m</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
