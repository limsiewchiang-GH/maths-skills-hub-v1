<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Angle of depression diagram: lighthouse and ship</title>
  <desc id="desc">A vertical lighthouse of height 40 root 3 metres. From the top, a horizontal dashed sightline is drawn. The angle of depression, between the horizontal and the line of sight down to a ship on the water, is marked 30 degrees. The horizontal distance from the lighthouse to the ship is unknown, marked x, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="60" y1="220" x2="260" y2="220" stroke="#3a2f22" stroke-width="2"/>
  <line x1="260" y1="220" x2="260" y2="105" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="260" y1="105" x2="60" y2="220" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="260" y1="105" x2="190" y2="105" stroke="#6b6157" stroke-width="1.5" stroke-dasharray="4 3"/>

  <path d="M242 220 L242 202 L260 202" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <g fill="#3a2f22">
    <circle cx="60" cy="220" r="3.5"/>
    <circle cx="260" cy="220" r="3.5"/>
    <circle cx="260" cy="105" r="3.5"/>
  </g>

  <path d="M226.00,105.00 L226.07,107.22 L226.29,109.42 L226.65,111.61 L227.15,113.77 L227.79,115.89 L228.57,117.97 L229.48,119.99 L230.53,121.95" fill="none" stroke="#d9480f" stroke-width="2.2"/>
  <text x="192" y="100" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">30°</text>

  <text x="266" y="168" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">40√3 m</text>
  <text x="40" y="240" fill="#3a2f22" font-family="Arial, sans-serif" font-size="16">ship</text>
  <text x="140" y="238" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">x</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
