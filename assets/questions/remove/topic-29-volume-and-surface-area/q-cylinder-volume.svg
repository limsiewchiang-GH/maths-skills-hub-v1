<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Cylinder diagram: radius 3 cm, height 10 cm</title>
  <desc id="desc">A cylinder with radius 3 cm and height 10 cm. Its volume is to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <path d="M100,230 A70 22 0 0 0 240,230" fill="none" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="100" y1="90" x2="100" y2="230" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="240" y1="90" x2="240" y2="230" stroke="#2a5db0" stroke-width="2.5"/>
  <ellipse cx="170" cy="90" rx="70" ry="22" fill="#fffdf8" stroke="#2a5db0" stroke-width="2.5"/>

  <line x1="170" y1="90" x2="240" y2="90" stroke="#3a2f22" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="205" y="78" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">3 cm</text>

  <text x="254" y="165" text-anchor="start" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">10 cm</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
