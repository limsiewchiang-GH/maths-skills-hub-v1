<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Compound solid: cylinder with hemisphere on top</title>
  <desc id="desc">A solid made from a cylinder of volume 50 pi and a hemisphere of volume 18 pi joined on top. The total volume is to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <path d="M100,110 L100,190 A70 20 0 0 0 240,190 L240,110 Z" fill="#2a5db0" fill-opacity="0.14" stroke="none"/>
  <path d="M100,110 A70 60 0 0 1 240,110 Z" fill="#2a5db0" fill-opacity="0.28" stroke="none"/>

  <path d="M100,190 A70 20 0 0 0 240,190" fill="none" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="100" y1="110" x2="100" y2="190" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="240" y1="110" x2="240" y2="190" stroke="#2a5db0" stroke-width="2.5"/>

  <path d="M100,110 A70 60 0 0 1 240,110" fill="none" stroke="#2a5db0" stroke-width="2.5"/>
  <ellipse cx="170" cy="110" rx="70" ry="20" fill="#fffdf8" stroke="#2a5db0" stroke-width="2.5"/>
  <ellipse cx="170" cy="110" rx="70" ry="20" fill="none" stroke="#2a5db0" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.6"/>

  <text x="170" y="160" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">V = 50π cm³</text>
  <text x="170" y="85" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">V = 18π cm³</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
