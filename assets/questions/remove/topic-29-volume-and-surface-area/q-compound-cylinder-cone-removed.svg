<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Compound solid: cylinder with a cone removed from one end</title>
  <desc id="desc">A cylinder of radius 4 cm and height 9 cm, with a cone of the same radius and height removed from the top end, leaving a conical hollow. The remaining solid material is shaded; the cone-shaped hollow is left unshaded. The remaining volume is to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <path d="M100,90 L100,230 A70 22 0 0 0 240,230 L240,90 Z" fill="#2a5db0" fill-opacity="0.16" stroke="none"/>
  <path d="M100,90 L170,210 L240,90 Z" fill="#fffdf8" stroke="none"/>

  <path d="M100,230 A70 22 0 0 0 240,230" fill="none" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="100" y1="90" x2="100" y2="230" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="240" y1="90" x2="240" y2="230" stroke="#2a5db0" stroke-width="2.5"/>
  <ellipse cx="170" cy="90" rx="70" ry="22" fill="none" stroke="#2a5db0" stroke-width="2.5"/>

  <path d="M100,90 L170,210 L240,90" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-linejoin="round"/>

  <line x1="170" y1="90" x2="240" y2="90" stroke="#3a2f22" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="205" y="78" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">4 cm</text>

  <text x="254" y="165" text-anchor="start" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">9 cm</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Cone-shaped hollow removed from the top.</text>
</svg>
