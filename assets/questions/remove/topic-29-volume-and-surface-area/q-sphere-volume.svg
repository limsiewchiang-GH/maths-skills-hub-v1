<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Sphere diagram: radius 6 cm</title>
  <desc id="desc">A sphere with radius 6 cm. Its volume is to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="170" cy="150" r="85" fill="none" stroke="#2a5db0" stroke-width="2.5"/>
  <ellipse cx="170" cy="150" rx="85" ry="26" fill="none" stroke="#2a5db0" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.6"/>

  <line x1="170" y1="150" x2="255" y2="150" stroke="#3a2f22" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="170" cy="150" r="3.5" fill="#3a2f22"/>
  <text x="164" y="168" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">O</text>
  <text x="212" y="140" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">6 cm</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
