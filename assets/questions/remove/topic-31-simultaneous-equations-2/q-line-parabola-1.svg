<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Graphs of y = x + 1 and y = x squared minus 1</title>
  <desc id="desc">The line y = x + 1 and the parabola y = x^2 - 1, meeting at two points. The coordinates of the intersection points are unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="30" y1="195.5" x2="310" y2="195.5" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="151.4" y1="20" x2="151.4" y2="240" stroke="#3a2f22" stroke-width="1.5"/>
  <text x="313" y="199" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">x</text>
  <text x="156" y="28" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">y</text>

  <path d="M40.0,57.3 L46.5,74.9 L53.0,91.4 L59.5,106.9 L66.0,121.4 L72.5,134.7 L79.0,147.0 L85.5,158.3 L92.0,168.5 L98.5,177.7 L105.0,185.7 L111.5,192.8 L118.0,198.7 L124.5,203.6 L131.0,207.5 L137.5,210.3 L144.0,212.0 L150.5,212.7 L157.0,212.3 L163.5,210.9 L170.0,208.4 L176.5,204.9 L183.0,200.2 L189.5,194.6 L196.0,187.9 L202.5,180.1 L209.0,171.2 L215.5,161.3 L222.0,150.4 L228.5,138.4 L235.0,125.3 L241.5,111.2 L248.0,96.0 L254.5,79.7 L261.0,62.4 L267.5,44.0 L274.0,24.6" fill="none" stroke="#2a5db0" stroke-width="2.5"/>

  <line x1="40" y1="230" x2="300" y2="109.1" stroke="#3a2f22" stroke-width="2"/>

  <g fill="#d9480f">
    <circle cx="225.7" cy="143.6" r="5"/>
    <circle cx="114.3" cy="195.5" r="5"/>
  </g>
  <text x="235" y="140" fill="#d9480f" font-family="Arial, sans-serif" font-size="14" font-weight="700">?</text>
  <text x="90" y="192" fill="#d9480f" font-family="Arial, sans-serif" font-size="14" font-weight="700">?</text>

  <text x="255" y="70" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-style="italic">y = x² − 1</text>
  <text x="255" y="115" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-style="italic">y = x + 1</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Find the coordinates where the line meets the curve.</text>
</svg>
