<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Graphs of x plus y equals 4 and y = x squared minus 2x minus 2</title>
  <desc id="desc">The line x + y = 4 and the parabola y = x^2 - 2x - 2, meeting at two points. The coordinates of the intersection points are unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="30" y1="175.7" x2="310" y2="175.7" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="155.6" y1="10" x2="155.6" y2="240" stroke="#3a2f22" stroke-width="1.5"/>
  <text x="313" y="180" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">x</text>
  <text x="160" y="18" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">y</text>

  <path d="M79.0,35.6 L85.5,57.2 L92.0,77.5 L98.5,96.3 L105.0,113.8 L111.5,129.9 L118.0,144.6 L124.5,158.0 L131.0,170.0 L137.5,180.6 L144.0,189.8 L150.5,197.7 L157.0,204.2 L163.5,209.3 L170.0,213.0 L176.5,215.4 L183.0,216.4 L189.5,216.0 L196.0,214.3 L202.5,211.1 L209.0,206.6 L215.5,200.7 L222.0,193.5 L228.5,184.9 L235.0,174.9 L241.5,163.5 L248.0,150.7 L254.5,136.6 L261.0,121.1 L267.5,104.3 L274.0,86.0 L280.5,66.4 L287.0,45.4 L293.5,23.0 L300.0,3.0" fill="none" stroke="#2a5db0" stroke-width="2.5"/>

  <line x1="40" y1="67.1" x2="300" y2="189.3" stroke="#3a2f22" stroke-width="2"/>

  <g fill="#d9480f">
    <circle cx="242.2" cy="162.1" r="5"/>
    <circle cx="97.8" cy="94.3" r="5"/>
  </g>
  <text x="250" y="158" fill="#d9480f" font-family="Arial, sans-serif" font-size="14" font-weight="700">?</text>
  <text x="105" y="115" fill="#d9480f" font-family="Arial, sans-serif" font-size="14" font-weight="700">?</text>

  <text x="45" y="70" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-style="italic">y = x² − 2x − 2</text>
  <text x="255" y="185" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-style="italic">x + y = 4</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Find the coordinates where the line meets the curve.</text>
</svg>
