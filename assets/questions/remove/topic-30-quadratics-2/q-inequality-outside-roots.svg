<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Graph of y = x squared minus 5x plus 6, with solution region shaded</title>
  <desc id="desc">The graph of y = x^2 - 5x + 6, a parabola crossing the x-axis at x=2 and x=3. The solution to x^2-5x+6 >= 0, where the curve is on or above the x-axis, is highlighted on the x-axis outside the two roots.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="30" y1="194.3" x2="310" y2="194.3" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="40" y1="30" x2="40" y2="230" stroke="#3a2f22" stroke-width="1.5"/>
  <text x="313" y="198" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">x</text>

  <path d="M40.0,40.0 L46.5,55.7 L53.0,70.5 L59.5,84.6 L66.0,97.9 L72.5,110.3 L79.0,122.0 L85.5,132.8 L92.0,142.9 L98.5,152.1 L105.0,160.5 L111.5,168.2 L118.0,175.0 L124.5,181.0 L131.0,186.2 L137.5,190.7 L144.0,194.3 L150.5,197.1 L157.0,199.1 L163.5,200.3 L170.0,200.7 L176.5,200.3 L183.0,199.1 L189.5,197.1 L196.0,194.3 L202.5,190.7 L209.0,186.2 L215.5,181.0 L222.0,175.0 L228.5,168.2 L235.0,160.5 L241.5,152.1 L248.0,142.9 L254.5,132.8 L261.0,122.0 L267.5,110.3 L274.0,97.9 L280.5,84.6 L287.0,70.5 L293.5,55.7 L300.0,40.0" fill="none" stroke="#2a5db0" stroke-width="2.5"/>

  <line x1="40" y1="194.3" x2="144" y2="194.3" stroke="#d9480f" stroke-width="5"/>
  <line x1="196" y1="194.3" x2="300" y2="194.3" stroke="#d9480f" stroke-width="5"/>

  <g fill="#d9480f">
    <circle cx="144" cy="194.3" r="5"/>
    <circle cx="196" cy="194.3" r="5"/>
  </g>
  <text x="144" y="215" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">2</text>
  <text x="196" y="215" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">3</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Highlighted: where x² − 5x + 6 ≥ 0.</text>
</svg>
