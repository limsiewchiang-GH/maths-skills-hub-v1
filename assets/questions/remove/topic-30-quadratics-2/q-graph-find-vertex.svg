<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Graph of y = x squared minus 6x plus 5</title>
  <desc id="desc">The graph of y = x^2 - 6x + 5, a parabola opening upward, crossing the x-axis at x=1 and x=5. Its vertex, the lowest point, is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="30" y1="177.2" x2="310" y2="177.2" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="170" y1="30" x2="170" y2="230" stroke="#3a2f22" stroke-width="1.5"/>
  <text x="313" y="181" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">x</text>
  <text x="174" y="38" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">y</text>

  <path d="M40.0,50.6 L46.5,67.0 L53.0,82.6 L59.5,97.4 L66.0,111.4 L72.5,124.4 L79.0,136.7 L85.5,148.1 L92.0,158.6 L98.5,168.4 L105.0,177.2 L111.5,185.2 L118.0,192.4 L124.5,198.8 L131.0,204.2 L137.5,208.9 L144.0,212.7 L150.5,215.6 L157.0,217.8 L163.5,219.0 L170.0,219.4 L176.5,219.0 L183.0,217.8 L189.5,215.6 L196.0,212.7 L202.5,208.9 L209.0,204.2 L215.5,198.8 L222.0,192.4 L228.5,185.2 L235.0,177.2 L241.5,168.4 L248.0,158.6 L254.5,148.1 L261.0,136.7 L267.5,124.4 L274.0,111.4 L280.5,97.4 L287.0,82.6 L293.5,67.0 L300.0,50.6" fill="none" stroke="#2a5db0" stroke-width="2.5"/>

  <g fill="#3a2f22">
    <circle cx="105" cy="177.2" r="3.5"/>
    <circle cx="235" cy="177.2" r="3.5"/>
  </g>
  <text x="105" y="196" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">1</text>
  <text x="235" y="196" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">5</text>

  <line x1="170" y1="177.2" x2="170" y2="219.4" stroke="#d9480f" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="170" cy="219.4" r="4.5" fill="#d9480f"/>
  <text x="178" y="235" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">Vertex = ?</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">y = x² − 6x + 5</text>
</svg>
