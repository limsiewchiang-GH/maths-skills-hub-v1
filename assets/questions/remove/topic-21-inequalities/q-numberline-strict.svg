<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" role="img" aria-labelledby="title desc">
  <title id="title">Number line: x greater than 4</title>
  <desc id="desc">A number line showing x greater than 4, with an open circle at 4 and the region to the right shaded, since 4 itself is not included.</desc>
  <rect width="340" height="140" fill="#fffdf8"/>

  <line x1="30" y1="70" x2="310" y2="70" stroke="#3a2f22" stroke-width="1.5"/>
  <g stroke="#3a2f22" stroke-width="1.5">
    <line x1="70" y1="65" x2="70" y2="75"/>
    <line x1="130" y1="65" x2="130" y2="75"/>
    <line x1="190" y1="65" x2="190" y2="75"/>
    <line x1="250" y1="65" x2="250" y2="75"/>
  </g>
  <g text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">
    <text x="70" y="95">2</text>
    <text x="130" y="95">3</text>
    <text x="190" y="95">4</text>
    <text x="250" y="95">5</text>
  </g>

  <line x1="190" y1="70" x2="300" y2="70" stroke="#d9480f" stroke-width="4"/>
  <path d="M300,70 L292,64 L292,76 Z" fill="#d9480f"/>
  <circle cx="190" cy="70" r="6" fill="#fffdf8" stroke="#d9480f" stroke-width="2.4"/>

  <text x="170" y="125" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">x &gt; 4 — open circle: 4 is not included.</text>
</svg>
