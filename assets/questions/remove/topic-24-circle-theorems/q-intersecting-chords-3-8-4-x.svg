<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Intersecting chords diagram</title>
  <desc id="desc">A circle with two chords AB and CD crossing inside the circle at point P. Segment PA is marked 3, segment PB is marked 8, segment PC is marked 4, and segment PD is marked x.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="170" cy="150" r="100" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <g stroke="#2a5db0" stroke-width="2.5" stroke-linecap="round">
    <line x1="76.03" y1="115.80" x2="263.97" y2="184.20"/>
    <line x1="187.36" y1="51.52" x2="135.80" y2="243.97"/>
  </g>

  <g fill="#3a2f22">
    <circle cx="76.03" cy="115.80" r="3.5"/>
    <circle cx="263.97" cy="184.20" r="3.5"/>
    <circle cx="187.36" cy="51.52" r="3.5"/>
    <circle cx="135.80" cy="243.97" r="3.5"/>
    <circle cx="161.78" cy="147.01" r="3"/>
  </g>

  <g fill="#3a2f22" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="52" y="112">A</text>
    <text x="270" y="188">B</text>
    <text x="192" y="45">C</text>
    <text x="112" y="252">D</text>
    <text x="146" y="140" font-size="14" font-weight="400" font-style="italic">P</text>
  </g>

  <text x="108" y="122" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">3</text>
  <text x="205" y="170" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">8</text>
  <text x="178" y="90" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
  <text x="132" y="205" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">x</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">AB and CD cross at P. Not to scale.</text>
</svg>
