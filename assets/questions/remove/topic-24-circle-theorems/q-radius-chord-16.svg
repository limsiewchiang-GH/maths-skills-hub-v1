<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Radius perpendicular to chord diagram</title>
  <desc id="desc">A circle with centre O and a horizontal chord AB. A perpendicular line from O meets the chord at its midpoint M, marked with a right angle symbol. The chord AB is 16 cm long, so each half AM and MB is marked as unknown.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="170" cy="150" r="100" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <line x1="76.03" y1="184.20" x2="263.97" y2="184.20" stroke="#2a5db0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="170" y1="150" x2="170" y2="184.20" stroke="#3a2f22" stroke-width="2.5" stroke-linecap="round"/>

  <g fill="#3a2f22">
    <circle cx="170" cy="150" r="3"/>
    <circle cx="76.03" cy="184.20" r="3.5"/>
    <circle cx="263.97" cy="184.20" r="3.5"/>
    <circle cx="170" cy="184.20" r="3"/>
  </g>

  <g fill="#3a2f22" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="150" y="142" font-size="14" font-weight="400" font-style="italic">O</text>
    <text x="55" y="205">A</text>
    <text x="270" y="205">B</text>
    <text x="176" y="200" font-size="14" font-weight="400" font-style="italic">M</text>
  </g>

  <path d="M170.0 184.2 L157.0 184.2 L157.0 171.2 L170.0 171.2 Z" fill="none" stroke="#d9480f" stroke-width="2"/>

  <text x="105" y="204" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">?</text>
  <text x="220" y="204" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">?</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">AB = 16 cm. Diagram not to scale.</text>
</svg>
