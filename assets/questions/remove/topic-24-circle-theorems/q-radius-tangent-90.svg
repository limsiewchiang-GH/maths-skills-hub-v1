<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Radius perpendicular to tangent diagram</title>
  <desc id="desc">A circle with centre O. A radius OA is drawn to point A on the circumference. A tangent line touches the circle at A. The angle between the radius and the tangent, marked with a right angle symbol, is 90 degrees.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="170" cy="150" r="90" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <line x1="232.34" y1="58.14" x2="276.80" y2="180.30" stroke="#3a2f22" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="170" y1="150" x2="254.57" y2="119.22" stroke="#2a5db0" stroke-width="2.5" stroke-linecap="round"/>

  <g fill="#3a2f22">
    <circle cx="170" cy="150" r="3"/>
    <circle cx="254.57" cy="119.22" r="3.5"/>
  </g>

  <g fill="#3a2f22" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="150" y="146" font-size="14" font-weight="400" font-style="italic">O</text>
    <text x="260" y="112">A</text>
  </g>

  <path d="M254.6 119.2 L266.8 114.8 L271.2 127.0 L259.0 131.4 Z" fill="none" stroke="#d9480f" stroke-width="2"/>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">OA is a radius. Diagram not to scale.</text>
</svg>
