<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Tangent kite diagram: tangents from a point and radius perpendicular to tangent</title>
  <desc id="desc">A circle with centre O. From an external point T, two tangent lines touch the circle at points A and B, with right angles marked where each tangent meets its radius. The angle at T between the two tangents is marked 50 degrees. The angle at O between the two radii is marked x degrees, the unknown to find.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="150" cy="150" r="75" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <g stroke="#2a5db0" stroke-width="2.5" stroke-linecap="round">
    <line x1="310" y1="150" x2="185.16" y2="216.25"/>
    <line x1="310" y1="150" x2="185.16" y2="83.75"/>
  </g>
  <g stroke="#3a2f22" stroke-width="2" stroke-linecap="round">
    <line x1="150" y1="150" x2="185.16" y2="216.25"/>
    <line x1="150" y1="150" x2="185.16" y2="83.75"/>
  </g>

  <g fill="#3a2f22">
    <circle cx="150" cy="150" r="3"/>
    <circle cx="310" cy="150" r="3.5"/>
    <circle cx="185.16" cy="216.25" r="3.5"/>
    <circle cx="185.16" cy="83.75" r="3.5"/>
  </g>

  <g fill="#3a2f22" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="130" y="146" font-size="14" font-weight="400" font-style="italic">O</text>
    <text x="315" y="154">T</text>
    <text x="190" y="230">A</text>
    <text x="190" y="78">B</text>
  </g>

  <path d="M185.2 216.2 L179.1 204.8 L190.5 198.7 L196.6 210.2 Z" fill="none" stroke="#d9480f" stroke-width="2"/>
  <path d="M185.2 83.8 L179.1 95.2 L190.5 101.3 L196.6 89.8 Z" fill="none" stroke="#d9480f" stroke-width="2"/>

  <path d="M290.57,160.31 L289.15,157.03 L288.29,153.56 L288.00,150.00 L288.29,146.44 L289.15,142.97 L290.57,139.69" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="255" y="154" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">50°</text>

  <path d="M162.19,172.97 L169.51,167.18 L174.32,159.18 L176.00,150.00 L174.32,140.82 L169.51,132.82 L162.19,127.03" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="184" y="154" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">x°</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">TA and TB are tangents. Not to scale.</text>
</svg>
