<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Triangle in a semicircle with a 41 degree angle</title>
  <desc id="desc">A circle with diameter AB through centre O. Point C is on the circumference close to the B side, giving a shorter, steeper triangle. Chords AC and BC are drawn. The angle at C is marked as a right angle since it is the angle in a semicircle. The angle at B is marked 41 degrees. The angle at A is marked x degrees, the unknown to find.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="170" cy="150" r="105" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <g stroke="#2a5db0" stroke-width="2.5" stroke-linecap="round">
    <line x1="65" y1="150" x2="256.0" y2="89.8"/>
    <line x1="275" y1="150" x2="256.0" y2="89.8"/>
  </g>
  <line x1="65" y1="150" x2="275" y2="150" stroke="#3a2f22" stroke-width="2.5" stroke-linecap="round"/>

  <g fill="#3a2f22">
    <circle cx="65" cy="150" r="3.5"/>
    <circle cx="275" cy="150" r="3.5"/>
    <circle cx="256.0" cy="89.8" r="3.5"/>
    <circle cx="170" cy="150" r="3"/>
  </g>

  <g fill="#3a2f22" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="45" y="172">A</text>
    <text x="280" y="172">B</text>
    <text x="262" y="78">C</text>
    <text x="176" y="168" font-size="14" font-weight="400" font-style="italic">O</text>
  </g>

  <!-- right-angle marker at C -->
  <path d="M256.0 89.8 L243.6 93.7 L247.5 106.1 L259.9 102.2 Z" fill="none" stroke="#d9480f" stroke-width="2"/>

  <!-- angle arc + label at A (unknown, named x in the question) -->
  <path d="M85.00,150.00 L84.97,148.98 L84.90,147.97 L84.77,146.96 L84.59,145.96 L84.36,144.96 L84.07,143.99" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="92" y="149" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">x°</text>

  <!-- angle arc + label at B (41 degrees, given) -->
  <path d="M257.00,150.00 L257.40,146.23 L258.58,142.63 L260.48,139.36 L263.03,136.55 L266.11,134.35 L269.59,132.83" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="237" y="136" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">41°</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">AB is a diameter of the circle. Diagram not to scale.</text>
</svg>
