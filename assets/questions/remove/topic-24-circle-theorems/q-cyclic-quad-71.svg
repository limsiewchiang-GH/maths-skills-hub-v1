<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Cyclic quadrilateral diagram, rotated</title>
  <desc id="desc">A circle with quadrilateral ABCD inscribed, vertices in order around the circumference, rotated to a different position than the other cyclic quadrilateral diagram. The angle at A is marked 71 degrees. The opposite angle at C is marked x degrees.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="170" cy="150" r="105" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <polygon points="188.23,46.60 273.40,131.77 134.09,248.67 71.33,114.09" fill="none" stroke="#2a5db0" stroke-width="2.5" stroke-linejoin="round"/>

  <g fill="#3a2f22">
    <circle cx="188.23" cy="46.60" r="3.5"/>
    <circle cx="273.40" cy="131.77" r="3.5"/>
    <circle cx="134.09" cy="248.67" r="3.5"/>
    <circle cx="71.33" cy="114.09" r="3.5"/>
  </g>

  <g fill="#3a2f22" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="186" y="36">A</text>
    <text x="280" y="130">B</text>
    <text x="140" y="253">C</text>
    <text x="44" y="112">D</text>
  </g>

  <path d="M169.18,57.60 L173.37,62.82 L178.94,66.53 L185.36,68.41 L192.05,68.26 L198.39,66.11 L203.79,62.15" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="188" y="90" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">71°</text>

  <path d="M150.94,234.53 L147.48,231.21 L143.39,228.73 L138.85,227.19 L134.09,226.67 L129.33,227.19 L124.79,228.73" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="118" y="212" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">x°</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">ABCD is a cyclic quadrilateral. Not to scale.</text>
</svg>
