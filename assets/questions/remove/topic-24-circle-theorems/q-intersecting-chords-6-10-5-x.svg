<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Intersecting chords diagram, rotated</title>
  <desc id="desc">A circle with two chords AB and CD crossing inside the circle at point P, positioned differently than the other intersecting chords diagram. Segment PA is marked 6, segment PB is marked 10, segment PC is marked 5, and segment PD is marked x.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="170" cy="150" r="100" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <g stroke="#2a5db0" stroke-width="2.5" stroke-linecap="round">
    <line x1="71.52" y1="167.36" x2="266.59" y2="124.12"/>
    <line x1="152.64" y1="51.52" x2="220.00" y2="236.60"/>
  </g>

  <g fill="#3a2f22">
    <circle cx="71.52" cy="167.36" r="3.5"/>
    <circle cx="266.59" cy="124.12" r="3.5"/>
    <circle cx="152.64" cy="51.52" r="3.5"/>
    <circle cx="220.00" cy="236.60" r="3.5"/>
    <circle cx="185.59" cy="142.07" r="3"/>
  </g>

  <g fill="#3a2f22" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="48" y="164">A</text>
    <text x="272" y="120">B</text>
    <text x="158" y="45">C</text>
    <text x="226" y="248">D</text>
    <text x="192" y="132" font-size="14" font-weight="400" font-style="italic">P</text>
  </g>

  <text x="105" y="146" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">6</text>
  <text x="228" y="126" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">10</text>
  <text x="160" y="88" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">5</text>
  <text x="200" y="200" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">x</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">AB and CD cross at P. Not to scale.</text>
</svg>
