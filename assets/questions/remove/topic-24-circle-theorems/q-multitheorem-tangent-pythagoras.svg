<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Radius, tangent, and Pythagoras diagram</title>
  <desc id="desc">A circle with centre O and radius OA marked 5 cm, to point A on the circumference. AT is a tangent at A, so angle OAT is a right angle. T is an external point. OT is marked 13 cm. TA is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <circle cx="140" cy="190" r="70" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <g stroke="#2a5db0" stroke-width="2.5" stroke-linecap="round">
    <line x1="140" y1="190" x2="95.00" y2="136.38"/>
    <line x1="140" y1="190" x2="194.59" y2="52.81"/>
  </g>
  <line x1="95.00" y1="136.38" x2="194.59" y2="52.81" stroke="#3a2f22" stroke-width="2.5" stroke-linecap="round"/>

  <g fill="#3a2f22">
    <circle cx="140" cy="190" r="3"/>
    <circle cx="95.00" cy="136.38" r="3.5"/>
    <circle cx="194.59" cy="52.81" r="3.5"/>
  </g>

  <g fill="#3a2f22" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="118" y="196" font-size="14" font-weight="400" font-style="italic">O</text>
    <text x="70" y="136">A</text>
    <text x="200" y="50">T</text>
  </g>

  <path d="M95.0 136.4 L103.4 146.3 L113.3 138.0 L105.0 128.0 Z" fill="none" stroke="#d9480f" stroke-width="2"/>

  <text x="102" y="172" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">5 cm</text>
  <text x="155" y="115" fill="#d9480f" font-family="Arial, sans-serif" font-size="16" font-weight="700">13 cm</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">AT is a tangent at A. Not to scale.</text>
</svg>
