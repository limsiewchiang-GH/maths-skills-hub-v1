<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" role="img" aria-labelledby="title desc">
  <title id="title">Parallel lines AB and CD angle diagram</title>
  <desc id="desc">AB is parallel to CD. Two slanted parallel lines are crossed by a slightly downward transversal. The right marked angle is 60 degrees and the corresponding marked angle on the left is labelled y.</desc>
  <rect width="280" height="340" fill="#fffdf8"/>

  <g stroke="#222" stroke-width="3" stroke-linecap="round">
    <line x1="38" y1="83" x2="146" y2="304"/>
    <line x1="155" y1="23" x2="261" y2="241"/>
    <line x1="5" y1="148" x2="274" y2="166"/>
  </g>

  <g stroke="#2f58ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="51" y1="102" x2="41" y2="111"/>
    <line x1="41" y1="111" x2="47" y2="111"/>
    <line x1="41" y1="111" x2="43" y2="105"/>

    <line x1="179" y1="68" x2="169" y2="77"/>
    <line x1="169" y1="77" x2="175" y2="77"/>
    <line x1="169" y1="77" x2="171" y2="71"/>
  </g>

  <g fill="#2f58ff" font-family="Arial, sans-serif" font-size="18" font-style="italic" font-weight="700">
    <text x="18" y="78">A</text>
    <text x="133" y="328">B</text>
    <text x="142" y="17">C</text>
    <text x="263" y="259">D</text>
  </g>

  <g fill="none" stroke="#ff4a2a" stroke-width="3" stroke-linecap="round">
    <path d="M213 147 A21 21 0 0 1 236 163"/>
    <path d="M92 153 A22 22 0 0 1 109 179"/>
  </g>

  <g fill="#ff4a2a" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="190" y="150">60°</text>
    <text x="107" y="191">y</text>
  </g>
</svg>
