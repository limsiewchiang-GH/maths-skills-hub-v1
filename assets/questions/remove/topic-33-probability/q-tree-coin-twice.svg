<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Tree diagram: a coin tossed twice</title>
  <desc id="desc">A probability tree diagram for a fair coin tossed twice. Each stage shows branches for heads and tails, each with probability 1/2. The two paths giving exactly one head, HT and TH, are highlighted.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="50" y1="140" x2="180" y2="70" stroke="#2a5db0" stroke-width="2"/>
  <line x1="50" y1="140" x2="180" y2="210" stroke="#2a5db0" stroke-width="2"/>

  <line x1="180" y1="70" x2="300" y2="40" stroke="#2a5db0" stroke-width="2"/>
  <line x1="180" y1="70" x2="300" y2="100" stroke="#d9480f" stroke-width="2.4"/>
  <line x1="180" y1="210" x2="300" y2="180" stroke="#d9480f" stroke-width="2.4"/>
  <line x1="180" y1="210" x2="300" y2="240" stroke="#2a5db0" stroke-width="2"/>

  <text x="105" y="93" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-weight="700">1/2</text>
  <text x="105" y="182" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-weight="700">1/2</text>
  <text x="232" y="47" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12" font-weight="700">1/2</text>
  <text x="232" y="93" fill="#d9480f" font-family="Arial, sans-serif" font-size="12" font-weight="700">1/2</text>
  <text x="232" y="187" fill="#d9480f" font-family="Arial, sans-serif" font-size="12" font-weight="700">1/2</text>
  <text x="232" y="234" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12" font-weight="700">1/2</text>

  <g fill="#3a2f22">
    <circle cx="50" cy="140" r="3.5"/>
    <circle cx="180" cy="70" r="3.5"/>
    <circle cx="180" cy="210" r="3.5"/>
    <circle cx="300" cy="40" r="3.5"/>
    <circle cx="300" cy="240" r="3.5"/>
  </g>
  <circle cx="300" cy="100" r="3.5" fill="#d9480f"/>
  <circle cx="300" cy="180" r="3.5" fill="#d9480f"/>

  <text x="184" y="66" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-weight="700">H</text>
  <text x="184" y="222" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-weight="700">T</text>
  <text x="304" y="36" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">H, H</text>
  <text x="304" y="104" fill="#d9480f" font-family="Arial, sans-serif" font-size="12" font-weight="700">H, T</text>
  <text x="304" y="176" fill="#d9480f" font-family="Arial, sans-serif" font-size="12" font-weight="700">T, H</text>
  <text x="304" y="244" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">T, T</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Highlighted: the outcomes with exactly one head.</text>
</svg>
