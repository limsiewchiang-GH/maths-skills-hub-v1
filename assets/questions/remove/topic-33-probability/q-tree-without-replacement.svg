<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Tree diagram: bag without replacement, red then red</title>
  <desc id="desc">A probability tree diagram. A bag has 3 red and 2 blue counters. Two are chosen without replacement. The first stage shows P(red) = 3/5 and P(blue) = 2/5. Because the counter is not replaced, the second-stage probabilities change depending on the first choice. The path for red then red is highlighted.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="50" y1="140" x2="180" y2="70" stroke="#d9480f" stroke-width="2.4"/>
  <line x1="50" y1="140" x2="180" y2="210" stroke="#2a5db0" stroke-width="2"/>

  <line x1="180" y1="70" x2="300" y2="40" stroke="#d9480f" stroke-width="2.4"/>
  <line x1="180" y1="70" x2="300" y2="100" stroke="#2a5db0" stroke-width="2"/>
  <line x1="180" y1="210" x2="300" y2="180" stroke="#2a5db0" stroke-width="2"/>
  <line x1="180" y1="210" x2="300" y2="240" stroke="#2a5db0" stroke-width="2"/>

  <text x="105" y="93" fill="#d9480f" font-family="Arial, sans-serif" font-size="13" font-weight="700">3/5</text>
  <text x="105" y="182" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-weight="700">2/5</text>
  <text x="228" y="47" fill="#d9480f" font-family="Arial, sans-serif" font-size="12" font-weight="700">2/4</text>
  <text x="228" y="93" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12" font-weight="700">2/4</text>
  <text x="228" y="187" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12" font-weight="700">3/4</text>
  <text x="228" y="234" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12" font-weight="700">1/4</text>

  <g fill="#3a2f22">
    <circle cx="50" cy="140" r="3.5"/>
    <circle cx="180" cy="70" r="3.5"/>
    <circle cx="180" cy="210" r="3.5"/>
    <circle cx="300" cy="100" r="3.5"/>
    <circle cx="300" cy="180" r="3.5"/>
    <circle cx="300" cy="240" r="3.5"/>
  </g>
  <circle cx="300" cy="40" r="3.5" fill="#d9480f"/>

  <text x="184" y="66" fill="#d9480f" font-family="Arial, sans-serif" font-size="13" font-weight="700">R</text>
  <text x="184" y="222" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-weight="700">B</text>
  <text x="304" y="36" fill="#d9480f" font-family="Arial, sans-serif" font-size="12" font-weight="700">R, R</text>
  <text x="304" y="104" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">R, B</text>
  <text x="304" y="176" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">B, R</text>
  <text x="304" y="244" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">B, B</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Chosen without replacement — second stage changes.</text>
</svg>
