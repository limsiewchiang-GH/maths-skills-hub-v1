<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Graph of y = cos x, marked at x = 180 degrees</title>
  <desc id="desc">The graph of y equals cos x from 0 to 360 degrees. A dashed line marks x = 180 degrees, where the value of y is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="50" y1="150" x2="310" y2="150" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="50" y1="80" x2="50" y2="220" stroke="#3a2f22" stroke-width="1.5"/>

  <text x="315" y="154" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">x</text>
  <text x="40" y="78" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">y</text>
  <text x="35" y="84" text-anchor="end" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">1</text>
  <text x="35" y="224" text-anchor="end" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">-1</text>
  <text x="115" y="240" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">90°</text>
  <text x="310" y="240" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="12">360°</text>

  <path d="M50.0,80.0 L57.2,81.1 L64.4,84.2 L71.7,89.4 L78.9,96.4 L86.1,105.0 L93.3,115.0 L100.6,126.1 L107.8,137.8 L115.0,150.0 L122.2,162.2 L129.4,173.9 L136.7,185.0 L143.9,195.0 L151.1,203.6 L158.3,210.6 L165.6,215.8 L172.8,218.9 L180.0,220.0 L187.2,218.9 L194.4,215.8 L201.7,210.6 L208.9,203.6 L216.1,195.0 L223.3,185.0 L230.6,173.9 L237.8,162.2 L245.0,150.0 L252.2,137.8 L259.4,126.1 L266.7,115.0 L273.9,105.0 L281.1,96.4 L288.3,89.4 L295.6,84.2 L302.8,81.1 L310.0,80.0" fill="none" stroke="#2a5db0" stroke-width="2.5"/>

  <line x1="180" y1="150" x2="180" y2="220" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="180" cy="220" r="4" fill="#d9480f"/>
  <text x="180" y="240" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="13" font-weight="700">180°</text>
  <text x="192" y="222" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">y = ?</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">y = cos x, for 0° ≤ x ≤ 360°.</text>
</svg>
