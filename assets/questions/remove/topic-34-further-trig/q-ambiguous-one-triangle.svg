<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Ambiguous case: only one possible triangle</title>
  <desc id="desc">From vertex A, angle A is 60 degrees and side b (to point C) is 6. Side a is 7. Since a is at least as long as b, the circle of radius a centred at C meets the ray from A at only one usable point, B, giving a single triangle.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="60" y1="220" x2="300" y2="220" stroke="#3a2f22" stroke-width="2"/>

  <circle cx="115" cy="124.74" r="128.3" fill="none" stroke="#6b6157" stroke-width="1.3" stroke-dasharray="4 3"/>

  <line x1="60" y1="220" x2="115" y2="124.74" stroke="#2a5db0" stroke-width="2.5"/>
  <line x1="115" y1="124.74" x2="200.95" y2="220" stroke="#2a5db0" stroke-width="2.5"/>

  <path d="M100,220 A40 40 0 0 0 78.13,182.86" fill="none" stroke="#3a2f22" stroke-width="2"/>
  <text x="100" y="198" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">60°</text>

  <text x="78" y="168" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">b = 6</text>
  <text x="180" y="168" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="14" font-weight="700">a = 7</text>

  <g fill="#3a2f22">
    <circle cx="60" cy="220" r="3.5"/>
    <circle cx="115" cy="124.74" r="3.5"/>
    <circle cx="200.95" cy="220" r="3.5"/>
  </g>
  <text x="42" y="238" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">A</text>
  <text x="120" y="117" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">C</text>
  <text x="206" y="238" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">B</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Only one triangle fits: a ≥ b.</text>
</svg>
