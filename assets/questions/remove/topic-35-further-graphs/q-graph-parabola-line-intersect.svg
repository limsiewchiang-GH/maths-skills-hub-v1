<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Graphs of y = x squared and y = 2x</title>
  <desc id="desc">The parabola y = x^2 and the line y = 2x, meeting at (0,0) and at a second point whose non-zero x-value is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <line x1="40" y1="210" x2="310" y2="210" stroke="#3a2f22" stroke-width="1.5"/>
  <line x1="120" y1="20" x2="120" y2="230" stroke="#3a2f22" stroke-width="1.5"/>
  <text x="313" y="214" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">x</text>
  <text x="124" y="28" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">y</text>

  <path d="M60.0,190.0 L66.0,193.8 L72.0,197.2 L78.0,200.2 L84.0,202.8 L90.0,205.0 L96.0,206.8 L102.0,208.2 L108.0,209.2 L114.0,209.8 L120.0,210.0 L126.0,209.8 L132.0,209.2 L138.0,208.2 L144.0,206.8 L150.0,205.0 L156.0,202.8 L162.0,200.2 L168.0,197.2 L174.0,193.8 L180.0,190.0 L186.0,185.8 L192.0,181.2 L198.0,176.2 L204.0,170.8 L210.0,165.0 L216.0,158.8 L222.0,152.2 L228.0,145.2 L234.0,137.8 L240.0,130.0 L246.0,121.8 L252.0,113.2 L258.0,104.2 L264.0,94.8 L270.0,85.0 L276.0,74.8 L282.0,64.2 L288.0,53.2 L294.0,41.8 L300.0,30.0" fill="none" stroke="#2a5db0" stroke-width="2.5"/>

  <line x1="60" y1="250" x2="300" y2="90" stroke="#3a2f22" stroke-width="2"/>

  <circle cx="120" cy="210" r="4.5" fill="#3a2f22"/>
  <g fill="#d9480f">
    <circle cx="240" cy="130" r="5"/>
  </g>
  <text x="248" y="150" fill="#d9480f" font-family="Arial, sans-serif" font-size="14" font-weight="700">x = ?</text>

  <text x="270" y="60" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-style="italic">y = x²</text>
  <text x="260" y="105" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13" font-style="italic">y = 2x</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Find the non-zero intersection.</text>
</svg>
