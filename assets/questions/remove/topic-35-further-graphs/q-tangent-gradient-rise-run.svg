<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Tangent to a curve, rise 6 over run 2</title>
  <desc id="desc">A curve with a straight tangent line touching it at one point. The tangent rises 6 units for a run of 2 units. The gradient is unknown, to be found.</desc>
  <rect width="340" height="280" fill="#fffdf8"/>

  <path d="M60,230 Q100,80 280,60" fill="none" stroke="#2a5db0" stroke-width="2.5"/>

  <line x1="79.6" y1="155.3" x2="206.2" y2="57.5" stroke="#3a2f22" stroke-width="2"/>
  <circle cx="135" cy="112.5" r="4" fill="#3a2f22"/>

  <line x1="135" y1="112.5" x2="206.2" y2="112.5" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="206.2" y1="112.5" x2="206.2" y2="57.5" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="170" y="128" text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="14" font-weight="700">run = 2</text>
  <text x="212" y="90" fill="#3a2f22" font-family="Arial, sans-serif" font-size="14" font-weight="700">rise = 6</text>

  <text x="150" y="240" text-anchor="middle" fill="#d9480f" font-family="Arial, sans-serif" font-size="15" font-weight="700">gradient = ?</text>

  <text x="170" y="264" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">Diagram not to scale.</text>
</svg>
