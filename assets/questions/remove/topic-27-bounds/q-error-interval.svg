<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" role="img" aria-labelledby="title desc">
  <title id="title">Number line: error interval for 3.4 correct to 1 d.p.</title>
  <desc id="desc">A number line showing the error interval 3.35 is less than or equal to x, and x is less than 3.45. A closed circle marks the lower bound 3.35, included, and an open circle marks the upper bound 3.45, not included.</desc>
  <rect width="340" height="140" fill="#fffdf8"/>

  <line x1="30" y1="70" x2="310" y2="70" stroke="#3a2f22" stroke-width="1.5"/>
  <g stroke="#3a2f22" stroke-width="1.5">
    <line x1="90" y1="65" x2="90" y2="75"/>
    <line x1="170" y1="65" x2="170" y2="75"/>
    <line x1="250" y1="65" x2="250" y2="75"/>
  </g>
  <g text-anchor="middle" fill="#3a2f22" font-family="Arial, sans-serif" font-size="13">
    <text x="90" y="95">3.35</text>
    <text x="170" y="95">3.4</text>
    <text x="250" y="95">3.45</text>
  </g>

  <line x1="90" y1="70" x2="250" y2="70" stroke="#d9480f" stroke-width="4"/>
  <circle cx="90" cy="70" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="2.4"/>
  <circle cx="250" cy="70" r="6" fill="#fffdf8" stroke="#d9480f" stroke-width="2.4"/>

  <text x="170" y="125" text-anchor="middle" fill="#6b6157" font-family="Arial, sans-serif" font-size="12" font-style="italic">3.35 ≤ x &lt; 3.45 — lower bound included, upper bound excluded.</text>
</svg>
