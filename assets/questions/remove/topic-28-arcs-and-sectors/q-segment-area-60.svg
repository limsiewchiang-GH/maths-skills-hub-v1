<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Segment area diagram: radius 12 cm, angle 60 degrees</title>
  <desc id="desc">A circle, centre O, radius 12 cm. A 60 degree sector OAB is shown with the chord AB drawn. The shaded segment, between the chord and the arc, is the region whose area is to be found, once the triangle OAB is removed from the sector.</desc>
