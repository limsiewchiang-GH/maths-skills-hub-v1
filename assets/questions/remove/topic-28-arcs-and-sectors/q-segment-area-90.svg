    <circle cx="170" cy="150" r="3.5"/>
    <circle cx="94.82" cy="122.64" r="3.5"/>
    <circle cx="197.36" cy="74.82" r="3.5"/>
  </g>
  <text x="178" y="146" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">O</text>
  <text x="72" y="118" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">A</text>
  <text x="200" y="68" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">B</text>

  <text x="122" y="139" fill="#3a2f22" font-family="Arial, sans-serif" font-size="15" font-weight="700">6 cm</text>

