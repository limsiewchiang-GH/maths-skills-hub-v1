<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Segment area diagram: radius 6 cm, angle 90 degrees</title>
  <desc id="desc">A circle, centre O, radius 6 cm. A 90 degree sector OAB is shown with the chord AB drawn. The shaded segment, between the chord and the arc, is the region whose area is to be found, once the triangle OAB is removed from the sector.</desc>
